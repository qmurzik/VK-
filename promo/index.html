<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>QVK Promo</title>
<style>
  :root {
    --void: #050507;
    --graphite: #15141b;
    --violet: #8b5cf6;
    --violet-deep: #5b21b6;
    --violet-soft: #c4b5fd;
    --lilac: #ddd6fe;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: var(--void); overflow: hidden; }
  body { font-family: "Inter", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  #root { position: absolute; inset: 0; overflow: hidden; background: var(--void); }
  canvas { position: absolute; left: 0; top: 0; }

  /* ---------- hook ---------- */
  #hook { position: absolute; left: 0; right: 0; top: 760px; text-align: center; }
  .hookline { position: relative; font-family: "Inter Display"; font-weight: 800; font-size: 92px;
    letter-spacing: -2.5px; line-height: 112px; white-space: pre; }
  .hookline .ghost { position: absolute; inset: 0; mix-blend-mode: screen; opacity: 0; }
  .hookline .r { color: #ff2d55; }
  .hookline .c { color: #22d3ee; }
  .hookline .accent { color: var(--violet-soft); }

  /* ---------- logo ---------- */
  .logo { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 34px;
    transform-origin: 0 0; white-space: nowrap; }
  .logo .mark { width: 190px; height: 190px; filter: drop-shadow(0 0 30px rgba(139, 92, 246, .75)); }
  .logo .word { font-family: "Inter Display"; font-weight: 900; font-size: 176px; letter-spacing: -6px;
    line-height: 1; background: linear-gradient(180deg, #ffffff 30%, #d9ccff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 26px rgba(139, 92, 246, .8)); }

  /* ---------- phone ---------- */
  #stage { position: absolute; inset: 0; perspective: 2600px; perspective-origin: 540px 1050px; }
  #phoneShadow { position: absolute; width: 700px; height: 160px; left: 190px; top: 1700px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(124, 58, 237, .55), rgba(124, 58, 237, 0)); filter: blur(10px); }
  #phone { position: absolute; left: 540px; top: 1110px; width: 414px; height: 868px; margin: -434px 0 0 -207px;
    transform-style: preserve-3d; }
  .rim { position: absolute; inset: 0; border-radius: 64px; }
  .front { position: absolute; inset: 0; border-radius: 64px; backface-visibility: hidden;
    background: #0b0a0f; box-shadow: inset 0 0 0 2px #4a4358, inset 0 0 0 4px #17151d, 0 0 0 1px #2b2734; }
  .back { position: absolute; inset: 0; border-radius: 64px; backface-visibility: hidden;
    transform: translateZ(-22px) rotateY(180deg); overflow: hidden;
    background: radial-gradient(120% 70% at 30% 20%, #2a2236 0%, #16131d 45%, #0b0a10 100%);
    box-shadow: inset 0 0 0 2px #4a4358; }
  .back .cam { position: absolute; left: 34px; top: 34px; width: 150px; height: 170px; border-radius: 44px;
    background: linear-gradient(145deg, #2a2533, #121016); box-shadow: inset 0 0 0 2px #3b3447, 0 6px 20px rgba(0,0,0,.6); }
  .back .lens { position: absolute; width: 56px; height: 56px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #4b3b74 0%, #120f19 45%, #000 70%);
    box-shadow: 0 0 0 5px #1a1720, 0 0 0 7px #3b3447; }
  .back .mk { position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; margin: -75px 0 0 -75px;
    filter: drop-shadow(0 0 30px rgba(139, 92, 246, .9)); }
  .back .bl { position: absolute; left: 0; right: 0; bottom: 120px; text-align: center; font-family: "Inter Display";
    font-weight: 800; letter-spacing: 8px; font-size: 22px; color: rgba(221, 214, 254, .55); }
  .screen { position: absolute; left: 12px; top: 12px; width: 390px; height: 844px; border-radius: 52px;
    overflow: hidden; background: #000; }
  .island { position: absolute; left: 50%; top: 11px; width: 108px; height: 30px; margin-left: -54px;
    border-radius: 20px; background: #000; z-index: 50; }
  .glare { position: absolute; inset: 0; z-index: 60; pointer-events: none;
    background: linear-gradient(112deg, rgba(255,255,255,0) 35%, rgba(255,255,255,.10) 47%, rgba(255,255,255,.02) 53%, rgba(255,255,255,0) 60%);
    background-size: 300% 100%; }
  .scr { position: absolute; inset: 0; overflow: hidden; }

  /* status bar shared */
  .sb { height: 44px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 6px 34px;
    font-size: 15px; font-weight: 600; letter-spacing: -.2px; }
  .sb .ic { display: flex; gap: 6px; align-items: center; }
  .sb .sig { width: 17px; height: 11px; background: linear-gradient(90deg, currentColor 0 22%, transparent 22% 26%, currentColor 26% 48%, transparent 48% 52%, currentColor 52% 74%, transparent 74% 78%, currentColor 78%);
    clip-path: polygon(0 100%, 100% 0, 100% 100%); }
  .sb .bat { width: 24px; height: 12px; border: 1.5px solid currentColor; border-radius: 4px; padding: 1.5px; opacity: .9; }
  .sb .bat i { display: block; height: 100%; width: 78%; background: currentColor; border-radius: 1.5px; }
  .gesture { position: absolute; left: 50%; bottom: 8px; width: 130px; height: 5px; margin-left: -65px; border-radius: 3px;
    background: currentColor; opacity: .55; }

  /* ---------- chat screen (VK-like, themed via vars) ---------- */
  .chat { background: var(--bg); color: var(--text); }
  .chat .top { background: var(--header); color: var(--headerText); }
  .chat .hdr { height: 60px; display: flex; align-items: center; padding: 0 14px 0 8px; gap: 10px;
    border-bottom: 1px solid var(--sep); }
  .chat .back-ic { font-size: 34px; font-weight: 300; color: var(--accent); width: 22px; margin-top: -4px; }
  .ava { border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; flex: none; }
  .chat .hdr .ava { width: 40px; height: 40px; font-size: 17px; background: linear-gradient(135deg, #f472b6, #8b5cf6); }
  .chat .who { flex: 1; line-height: 1.2; }
  .chat .who b { display: block; font-size: 16.5px; font-weight: 650; }
  .chat .who span { font-size: 13px; color: var(--text2); }
  .chat .hic { width: 24px; height: 24px; color: var(--accent); }
  .chat .msgs { position: absolute; left: 0; right: 0; top: 104px; bottom: 74px; padding: 14px 12px;
    display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; overflow: hidden;
    font-family: var(--msgFont, "Inter"); }
  .chat .day { align-self: center; font-size: 12.5px; color: var(--text2); background: color-mix(in srgb, var(--field) 80%, transparent);
    padding: 4px 12px; border-radius: 12px; margin-bottom: 4px; font-family: "Inter"; }
  .b { max-width: 80%; padding: 9px 13px 8px; border-radius: 18px; font-size: calc(16px * var(--msgScale, 1));
    line-height: 1.32; position: relative; }
  .b .tm { font-size: 11px; color: var(--text2); margin-left: 8px; float: right; margin-top: 6px; font-family: "Inter"; }
  .b.in { align-self: flex-start; background: var(--bin); border-bottom-left-radius: 6px; }
  .b.out { align-self: flex-end; background: var(--bout); border-bottom-right-radius: 6px; }
  .b.out .tm::after { content: " ✓✓"; color: var(--accent); }
  .chat .wb { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; background: var(--header);
    border-top: 1px solid var(--sep); display: flex; align-items: flex-start; padding: 10px 12px 0; gap: 10px; }
  .chat .wb .fld { flex: 1; height: 38px; border-radius: 19px; background: var(--field); color: var(--text2);
    font-size: 15.5px; display: flex; align-items: center; padding: 0 16px; }
  .chat .wb .send { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
  .chat .wb .clip { width: 26px; height: 38px; color: var(--icon); display: grid; place-items: center; }
  .chat .gesture { color: var(--text); }

  /* ---------- dashboard (module home, Material3 dark) ---------- */
  .dash { background: #111318; color: #e2e2e6; }
  .dash .sb { color: #e2e2e6; }
  .dash .body { position: absolute; left: 0; right: 0; top: 44px; padding: 12px 14px; }
  .mcard { background: #1d2025; border-radius: 18px; margin-top: 10px; padding: 15px 16px; display: flex; align-items: center;
    box-shadow: 0 1px 2px rgba(0,0,0,.4); position: relative; overflow: hidden; }
  .hero { background: #2787f5; color: #fff; display: block; padding: 20px; margin-top: 4px; }
  .hero h1 { font-size: 27px; font-weight: 800; letter-spacing: -.3px; }
  .hero .cnt { font-size: 14.5px; opacity: .95; margin-top: 2px; }
  .hero .row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-size: 16px; }
  .hero .st { font-size: 12px; margin-top: 12px; opacity: .95; }
  .msw { width: 52px; height: 32px; border-radius: 16px; position: relative; flex: none; }
  .msw i { position: absolute; top: 50%; border-radius: 50%; transform: translateY(-50%); }
  .hero .msw { background: #d6e3ff; }
  .hero .msw i { right: 4px; width: 24px; height: 24px; background: #0b4fa8; }
  .dash .hd { color: #2787f5; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px; padding: 18px 4px 4px; }
  .mcard .em { font-size: 26px; width: 42px; }
  .mcard .tx { flex: 1; line-height: 1.25; }
  .mcard .tx b { display: block; font-size: 16px; font-weight: 700; }
  .mcard .tx span { font-size: 13px; color: #a0a3a8; }
  .badge { min-width: 44px; padding: 4px 10px; border-radius: 14px; font-size: 13px; font-weight: 700; text-align: center; }
  .badge.on { background: #2787f5; color: #fff; }
  .badge.off { background: rgba(160, 163, 168, .14); color: #a0a3a8; }
  .chev { color: #a0a3a8; font-size: 24px; width: 30px; text-align: right; }
  .ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,.16); pointer-events: none; }

  /* ---------- feed (VK-like, themed) ---------- */
  .feed { background: var(--bg); color: var(--text); }
  .feed .top { background: var(--header); color: var(--headerText); position: relative; z-index: 2; }
  .feed .hdr { height: 54px; display: flex; align-items: center; padding: 0 16px; gap: 18px; font-size: 22px; font-weight: 750; }
  .feed .hdr .tab2 { font-size: 15.5px; font-weight: 600; color: var(--text2); }
  .feed .hdr .ul { position: relative; }
  .feed .hdr .ul::after { content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 3px; border-radius: 2px; background: var(--accent); }
  .feed .list { position: absolute; left: 0; right: 0; top: 98px; padding: 8px 0; }
  .post { background: var(--card); margin: 0 0 8px; padding: 12px 14px; overflow: hidden; position: relative; }
  .post .ph { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .post .ph .ava { width: 40px; height: 40px; font-size: 16px; }
  .post .ph b { display: block; font-size: 15px; font-weight: 650; }
  .post .ph span { font-size: 12.5px; color: var(--text2); }
  .post p { font-size: 15px; line-height: 1.38; margin-bottom: 10px; }
  .post .img { height: 190px; border-radius: 12px; position: relative; overflow: hidden; }
  .post .acts { display: flex; gap: 10px; margin-top: 10px; }
  .post .acts span { background: var(--field); color: var(--text2); border-radius: 16px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; }
  .post .adl { font-size: 12px; color: var(--text2); }
  .post .cta { margin-top: 10px; background: var(--accent); color: #111; text-align: center; border-radius: 10px; padding: 9px; font-weight: 700; font-size: 14.5px; }
  .post .scan { position: absolute; inset: 0; pointer-events: none; }
  .post .stamp { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 10px 18px; border-radius: 14px;
    font-weight: 800; font-size: 17px; color: #fff; background: rgba(124, 58, 237, .92); box-shadow: 0 0 30px rgba(139, 92, 246, .8);
    white-space: nowrap; opacity: 0; }
  .reco { display: flex; gap: 10px; }
  .reco div { flex: 1; height: 120px; border-radius: 12px; }
  .feed .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; background: var(--tabbar); border-top: 1px solid var(--sep);
    display: flex; justify-content: space-around; padding-top: 12px; color: var(--icon); z-index: 3; }
  .feed .tabbar svg { width: 27px; height: 27px; }
  .feed .tabbar .act { color: var(--accent); }
  .feed .gesture { color: var(--text); }

  /* ---------- privacy settings (Material3 dark) ---------- */
  .prefs { background: #111318; color: #e2e2e6; }
  .prefs .sb { color: #e2e2e6; }
  .prefs .tb { height: 64px; display: flex; align-items: center; gap: 22px; padding: 0 18px; font-size: 22px; font-weight: 500; }
  .prefs .cat { color: #2787f5; font-size: 14px; font-weight: 600; padding: 14px 20px 6px; }
  .prow { display: flex; align-items: center; padding: 14px 20px; gap: 16px; position: relative; }
  .prow .tx { flex: 1; line-height: 1.3; }
  .prow .tx b { display: block; font-size: 16.5px; font-weight: 500; }
  .prow .tx span { font-size: 14px; color: #a0a3a8; }
  .prow .msw { border: 2px solid #8c9199; background: #2b2e33; }
  .prow .msw i { left: 6px; width: 16px; height: 16px; background: #8c9199; }

  /* ---------- floating UI cards ---------- */
  .float { position: absolute; border-radius: 30px; background: rgba(24, 21, 32, .82);
    border: 1px solid rgba(196, 181, 253, .22); box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(124, 58, 237, .25), inset 0 1px 0 rgba(255,255,255,.08);
    backdrop-filter: blur(18px); color: #ece8ff; }
  #picker { left: 588px; top: 640px; width: 400px; padding: 26px 28px; }
  #picker .t { font-size: 24px; font-weight: 700; }
  #picker .s { font-size: 17px; color: #a79fc4; margin-top: 2px; }
  #picker .pv { height: 70px; border-radius: 14px; margin: 18px 0 12px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  #picker .hex { font-family: "JetBrains Mono"; font-size: 24px; letter-spacing: 1px; padding: 8px 0 12px; border-bottom: 2px solid #8b5cf6; margin-bottom: 10px; }
  .sl { display: flex; align-items: center; gap: 14px; height: 40px; }
  .sl b { width: 18px; font-size: 18px; color: #a79fc4; font-weight: 600; }
  .sl .tr { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); position: relative; }
  .sl .tr i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: #8b5cf6; }
  .sl .tr u { position: absolute; top: 50%; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: #c4b5fd; box-shadow: 0 0 14px rgba(167, 139, 250, .9); }
  #chip { left: 0; top: 0; padding: 16px 30px 16px 22px; border-radius: 40px; display: flex; align-items: center; gap: 18px; white-space: nowrap; }
  #chip .nm { font-size: 34px; font-weight: 750; letter-spacing: -.5px; }
  #chip .dots { display: flex; }
  #chip .dots i { width: 34px; height: 34px; border-radius: 50%; margin-left: -9px; box-shadow: 0 0 0 3px #1a1622; }
  #chip .dots i:first-child { margin-left: 0; }
  #fontcard { left: 40px; top: 660px; width: 360px; padding: 24px 26px; }
  #fontcard .lb { font-size: 16px; color: #a79fc4; }
  #fontcard .v { font-size: 30px; font-weight: 700; margin: 2px 0 14px; }
  #fontcard .opts { display: flex; gap: 8px; margin-bottom: 18px; }
  #fontcard .opts span { flex: 1; text-align: center; padding: 9px 0; border-radius: 12px; font-size: 22px; background: rgba(255,255,255,.06); }
  #fontcard .opts span.on { background: #7c3aed; box-shadow: 0 0 20px rgba(139, 92, 246, .7); }

  /* ---------- captions ---------- */
  .cap { position: absolute; left: 60px; right: 60px; text-align: center; }
  .cap .h { font-family: "Inter Display"; font-weight: 900; font-size: 104px; letter-spacing: -3.5px; line-height: 1.02;
    text-shadow: 0 0 34px rgba(139, 92, 246, .55), 0 4px 30px rgba(0,0,0,.8); }
  .cap .s { font-family: "Inter"; font-weight: 600; font-size: 40px; letter-spacing: -.6px; color: var(--lilac); margin-top: 18px;
    text-shadow: 0 2px 20px rgba(0,0,0,.9); }
  .w { display: inline-block; white-space: pre; }
  .ch { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }
  .grad { background: linear-gradient(180deg, #fff 35%, #c9b8ff 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }

  #tag { position: absolute; left: 50%; top: 0; transform: translateX(-50%); padding: 12px 26px; border-radius: 30px; white-space: nowrap;
    font-size: 28px; font-weight: 600; color: #ddd6fe; background: rgba(124, 58, 237, .16); border: 1px solid rgba(167, 139, 250, .4); }

  #cta { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; align-items: center; }
  #pill { position: relative; margin-top: 46px; padding: 26px 50px 26px 30px; border-radius: 80px; display: flex; align-items: center; gap: 26px;
    background: linear-gradient(180deg, rgba(40, 30, 64, .95), rgba(22, 17, 34, .95)); overflow: hidden; }
  #pill::before { content: ""; position: absolute; inset: 0; border-radius: 80px; padding: 3px;
    background: conic-gradient(from var(--ang, 0deg), #8b5cf6, #22d3ee, #f0abfc, #8b5cf6);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; }
  #pill .pl { width: 92px; height: 92px; border-radius: 50%; background: linear-gradient(135deg, #a78bfa, #6d28d9); display: grid; place-items: center;
    box-shadow: 0 0 30px rgba(139, 92, 246, .8); }
  #pill .u { font-size: 64px; font-weight: 750; letter-spacing: -1.5px; }

  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; mix-blend-mode: screen; }
  #vig { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 80% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="gMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/><stop offset=".55" stop-color="#7c3aed"/><stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="gShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <symbol id="qmark" viewBox="0 0 200 200">
      <rect x="4" y="4" width="192" height="192" rx="58" fill="url(#gMark)"/>
      <rect x="4" y="4" width="192" height="192" rx="58" fill="url(#gShine)"/>
      <rect x="5.5" y="5.5" width="189" height="189" rx="56.5" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3"/>
      <circle cx="96" cy="94" r="47" fill="none" stroke="#fff" stroke-width="21"/>
      <path d="M118 118 L150 150" stroke="#fff" stroke-width="22" stroke-linecap="round"/>
    </symbol>
    <filter id="mblur" x="-20%" y="-5%" width="140%" height="110%"><feGaussianBlur id="mblurStd" stdDeviation="0 0"/></filter>
  </defs>
</svg>

<div id="root">
  <canvas id="bg" width="1080" height="1920"></canvas>

  <div id="hook">
    <div class="hookline" id="hk1"></div>
    <div class="hookline" id="hk2"></div>
  </div>

  <div class="logo" id="logo">
    <svg class="mark"><use href="#qmark"/></svg>
    <div class="word">QVK</div>
  </div>

  <div id="stage">
    <div id="phoneShadow"></div>
    <div id="phone">
      <div id="rims"></div>
      <div class="back">
        <div class="cam">
          <div class="lens" style="left:18px;top:18px"></div>
          <div class="lens" style="left:76px;top:18px"></div>
          <div class="lens" style="left:18px;top:94px"></div>
        </div>
        <svg class="mk"><use href="#qmark"/></svg>
        <div class="bl">QVK</div>
      </div>
      <div class="front">
        <div class="screen" id="screen">
          <div class="scr" id="sChat"></div>
          <div class="scr" id="sChatB"></div>
          <div class="scr dash" id="sDash"></div>
          <div class="scr" id="sFeed"></div>
          <div class="scr prefs" id="sPriv"></div>
          <div class="island"></div>
          <div class="glare" id="glare"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="float" id="chip"><div class="dots" id="chipDots"></div><div class="nm" id="chipName"></div></div>

  <div class="float" id="picker">
    <div class="t">Исходящие сообщения</div>
    <div class="s">Цвет · слот bubble_out</div>
    <div class="pv" id="pkPrev"></div>
    <div class="hex" id="pkHex">#FF4B3A78</div>
    <div class="sl"><b>A</b><div class="tr"><i></i><u></u></div></div>
    <div class="sl"><b>R</b><div class="tr"><i></i><u></u></div></div>
    <div class="sl"><b>G</b><div class="tr"><i></i><u></u></div></div>
    <div class="sl"><b>B</b><div class="tr"><i></i><u></u></div></div>
  </div>

  <div class="float" id="fontcard">
    <div class="lb">Семейство</div>
    <div class="v" id="fcFam">Без засечек</div>
    <div class="opts" id="fcOpts">
      <span style="font-family:Inter">Аа</span><span style="font-family:'DejaVu Serif'">Аа</span><span style="font-family:'JetBrains Mono'">Аа</span>
    </div>
    <div class="lb">Размер шрифта, %</div>
    <div class="v" id="fcSize">100</div>
    <div class="sl"><b></b><div class="tr" id="fcTrack"><i></i><u></u></div></div>
