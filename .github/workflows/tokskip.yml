name: TokSkip

on:
  push:
    paths: [ "tokskip/**", ".github/workflows/tokskip.yml" ]
  pull_request:
    paths: [ "tokskip/**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tokskip
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0" >/dev/null

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tokskip-debug
          path: tokskip/app/build/outputs/apk/debug/app-debug.apk
